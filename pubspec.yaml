name: movielog
description: MovieLog with TMDB, MVVM and Provider.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter
  go_router: ^16.2.0
  flutter_rating_bar: ^4.0.1
  flutter_svg: ^2.3.0
  shared_preferences: ^2.5.5
  dio: ^5.9.2
  provider: ^6.1.5+1
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/icons/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/font/Manrope-VariableFont_wght.ttf
